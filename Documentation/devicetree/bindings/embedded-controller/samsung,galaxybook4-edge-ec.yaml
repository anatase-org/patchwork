%YAML 1.2
---
$id: http://devicetree.org/schemas/embedded-controller/samsung,galaxybook4-edge-ec.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Galaxy Book4 Edge Embedded Controller

maintainers:
  - Antheas Kapenekakis <lkml@antheas.dev>

description: |
  The ENE KB9058 embedded controller exposes battery and AC adapter status
  and keyboard backlight control through a mailbox at its second I2C
  address. The battery register layout follows the Samsung Galaxy Book4
  Edge ACPI battery methods. A separate I2C interface reports events,
  signalled through the mailbox interface interrupt.

properties:
  compatible:
    enum:
      - samsung,galaxybook4-edge-ec
      - samsung,galaxybook4-edge-ec-events

  reg:
    maxItems: 1

  samsung,event-interface:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      EC event interface on a separate I2C bus. The referenced node supplies
      its I2C address through reg. Events use the mailbox interface interrupt.
      The referenced node must be disabled to prevent independent enumeration;
      the mailbox driver creates and owns its I2C client.

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg

allOf:
  - if:
      properties:
        compatible:
          const: samsung,galaxybook4-edge-ec
    then:
      required:
        - interrupts
    else:
      required:
        - status
      properties:
        status:
          const: disabled
        interrupts: false
        samsung,event-interface: false

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        embedded-controller@64 {
            compatible = "samsung,galaxybook4-edge-ec";
            reg = <0x64>;
            samsung,event-interface = <&ec_events>;
            interrupt-parent = <&gpio0>;
            interrupts = <66 IRQ_TYPE_EDGE_FALLING>;
        };
    };

    i2c-events {
        #address-cells = <1>;
        #size-cells = <0>;

        ec_events: embedded-controller@62 {
            compatible = "samsung,galaxybook4-edge-ec-events";
            reg = <0x62>;
            status = "disabled";
        };
    };
...
