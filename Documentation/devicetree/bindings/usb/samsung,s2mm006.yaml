%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/samsung,s2mm006.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S2MM006 USB Type-C controller

maintainers:
  - Antheas Kapenekakis <lkml@antheas.dev>

description: |
  The S2MM006 controls the USB Type-C power path on the Samsung Galaxy Book4
  Edge NP750XQB. The firmware exposes the connector and its USB data links
  separately through Qualcomm PMIC GLINK.

properties:
  compatible:
    const: samsung,s2mm006

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pdic@33 {
            compatible = "samsung,s2mm006";
            reg = <0x33>;
        };
    };
...
