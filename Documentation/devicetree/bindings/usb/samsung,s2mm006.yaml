%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/samsung,s2mm006.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S2MM006 USB Type-C controller

maintainers:
  - Antheas Kapenekakis <lkml@antheas.dev>

description: |
  The S2MM006 controls Type-C attachment, power paths and USB Power Delivery
  on the Samsung Galaxy Book4 Edge NP750XQB. Its connector describes the USB
  data role, orientation and mode switch connections.

properties:
  compatible:
    const: samsung,s2mm006

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  connector:
    $ref: /schemas/connector/usb-connector.yaml#

required:
  - compatible
  - reg
  - interrupts
  - connector

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pdic@33 {
            compatible = "samsung,s2mm006";
            reg = <0x33>;
            interrupt-parent = <&gpio0>;
            interrupts = <42 IRQ_TYPE_LEVEL_LOW>;

            connector {
                compatible = "usb-c-connector";
                power-role = "dual";
                data-role = "dual";
            };
        };
    };
...
