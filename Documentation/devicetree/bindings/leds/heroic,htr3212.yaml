%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/heroic,htr3212.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HEROIC HTR3212 12-channel LED controller

maintainers:
  - Teguh Sobirin <teguh@sobir.in>

description:
  The HTR3212 is a 12-channel LED driver with 8-bit PWM brightness control,
  configured over I2C.

properties:
  compatible:
    const: heroic,htr3212

  reg:
    maxItems: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

  sdb-gpios:
    maxItems: 1
    description: GPIO connected to the SDB pin, asserted to enable the chip.

  vdd-supply:
    description: Power supply.

  always-on:
    type: boolean
    description: Keep the LEDs lit across system suspend.

patternProperties:
  "^led@[1-9a-c]$":
    type: object
    $ref: common.yaml#
    unevaluatedProperties: false

    properties:
      reg:
        description: LED output channel.
        minimum: 1
        maximum: 12

    required:
      - reg

required:
  - compatible
  - reg
  - "#address-cells"
  - "#size-cells"
  - vdd-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/leds/common.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        led-controller@3c {
            compatible = "heroic,htr3212";
            reg = <0x3c>;
            #address-cells = <1>;
            #size-cells = <0>;

            sdb-gpios = <&tlmm 55 GPIO_ACTIVE_HIGH>;
            vdd-supply = <&vdd_led>;

            led@1 {
                reg = <1>;
                color = <LED_COLOR_ID_RED>;
            };

            led@2 {
                reg = <2>;
                color = <LED_COLOR_ID_GREEN>;
            };

            led@3 {
                reg = <3>;
                color = <LED_COLOR_ID_BLUE>;
            };
        };
    };
