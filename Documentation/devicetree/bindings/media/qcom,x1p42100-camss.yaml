%YAML 1.2
---
$id: http://devicetree.org/schemas/media/qcom,x1p42100-camss.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm X1P42100 Camera Subsystem (CAMSS)

maintainers:
  - Antheas Kapenekakis <lkml@antheas.dev>

description:
  The CAMSS IP is a CSI decoder and ISP present on Qualcomm platforms.
  X1P42100 provides one full Image Front End.

properties:
  compatible:
    const: qcom,x1p42100-camss

  reg:
    maxItems: 4

  reg-names:
    items:
      - const: csid0
      - const: csid_wrapper
      - const: csiphy0
      - const: vfe0

  clocks:
    maxItems: 13

  clock-names:
    items:
      - const: camnoc_nrt_axi
      - const: camnoc_rt_axi
      - const: cpas_ahb
      - const: cpas_fast_ahb
      - const: cpas_vfe0
      - const: csid
      - const: csid_csiphy_rx
      - const: csiphy0
      - const: csiphy0_timer
      - const: gcc_axi_hf
      - const: gcc_axi_sf
      - const: vfe0
      - const: vfe0_fast_ahb

  interrupts:
    maxItems: 3

  interrupt-names:
    items:
      - const: csid0
      - const: csiphy0
      - const: vfe0

  interconnects:
    maxItems: 4

  interconnect-names:
    items:
      - const: ahb
      - const: hf_mnoc
      - const: sf_mnoc
      - const: sf_icp_mnoc

  iommus:
    maxItems: 2

  power-domains:
    items:
      - description: IFE0 GDSC - Image Front End, Global Distributed Switch Controller.
      - description: Titan Top GDSC - Titan ISP Block, Global Distributed Switch Controller.

  power-domain-names:
    items:
      - const: ife0
      - const: top

  vdd-csiphy-0p8-supply:
    description: 0.8V supply to a PHY.

  vdd-csiphy-1p2-supply:
    description: 1.2V supply to a PHY.

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    description: CSI input ports.

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/$defs/port-base
        unevaluatedProperties: false

        properties:
          endpoint:
            $ref: video-interfaces.yaml#
            unevaluatedProperties: false

            properties:
              data-lanes:
                minItems: 1
                maxItems: 4

              bus-type:
                enum:
                  - 1 # MEDIA_BUS_TYPE_CSI2_CPHY
                  - 4 # MEDIA_BUS_TYPE_CSI2_DPHY

            required:
              - data-lanes

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - interrupts
  - interrupt-names
  - interconnects
  - interconnect-names
  - iommus
  - power-domains
  - power-domain-names
  - vdd-csiphy-0p8-supply
  - vdd-csiphy-1p2-supply
  - ports

additionalProperties: false
